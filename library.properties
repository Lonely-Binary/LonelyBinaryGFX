sentence=The drawing layer shared by every Lonely Binary display - TFT, VGA and e-paper.
paragraph=One small drawing API that every Lonely Binary panel implements, so a sketch moves between products unchanged and a function can take a display of any kind. Shapes, bitmap text, JPEG and palettes, with the colour quantised per panel: full colour on a TFT, sixteen colours on VGA, two or four inks on e-paper. Device libraries depend on this one; you install it once and rarely include it yourself. No third-party graphics dependency. Brought to you by Lonely Binary - thank you for supporting our open-source work!
category=Display
